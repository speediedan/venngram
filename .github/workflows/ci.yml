name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test]" ruff pyright
      - name: Lint
        run: ruff check src tests scripts
      - name: Type check
        run: pyright -p pyproject.toml
      - name: Test
        run: python -m pytest -q

  docs:
    # the Read the Docs build, with warnings as errors, so a docs break fails here first
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -r docs/requirements.txt
      - name: Build
        run: python -m sphinx -W --keep-going -b html docs/source docs/_build/html
