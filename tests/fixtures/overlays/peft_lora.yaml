# PEFT's LoRA family (LoRA, its embedding variant, DoRA's magnitude vector, and AdaLoRA's `lora_E`, whose layer
# subclasses LoRA's) as adapters, one role per adapter name: PEFT keys each container by adapter name, which `{key}`
# takes. The seed registry publishes this overlay map; a test registry indexes this copy.
schema_version: 5
overlay: peft.lora
applies_when:
  module_classes: [peft.tuners.lora.layer.LoraLayer]
  module_names: [lora_A, lora_B, lora_E, lora_embedding_A, lora_embedding_B, lora_magnitude_vector]
roles:
  lora_A: adapter:{key}
  lora_B: adapter:{key}
  lora_E: adapter:{key}
  lora_embedding_A: adapter:{key}
  lora_embedding_B: adapter:{key}
  lora_magnitude_vector: adapter:{key}
